services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-flash-latest}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - upload_data:/app/uploads
      - faiss_data:/app/storage/faiss
    networks:
      - researchpilot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-80}:80"
    networks:
      - researchpilot-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  researchpilot-net:
    driver: bridge

volumes:
  upload_data:
    driver: local
  faiss_data:
    driver: local
